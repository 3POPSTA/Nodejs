<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simple Chat</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
    }
    #messages {
      list-style-type: none;
      margin: 0 0 20px;
      padding: 10px;
      border: 1px solid #ddd;
      height: 400px;
      overflow-y: auto;
    }
    #messages li {
      padding: 8px 16px;
      border-bottom: 1px solid #eee;
    }
    #messages li:last-child {
      border-bottom: none;
    }
    #form {
      display: flex;
      margin-top: 10px;
    }
    #input {
      flex-grow: 1;
      padding: 10px;
      font-size: 16px;
    }
    button {
      margin-left: 10px;
      padding: 10px 20px;
      border: none;
      background: #4CAF50;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background: #45a049;
    }
    .system-message {
      color: #666;
      font-size: 0.9em;
      font-style: italic;
    }
  </style>
</head>
<body>
  <h1>Simple Chat</h1>
  <div id="username-container">
    <label for="username-input">Username</label>
    <input id="username-input" type="text" maxlength="32" placeholder="Enter your username">
    <button id="set-username" type="button">Set Username</button>
  </div>
  <ul id="messages" aria-live="polite"></ul>
  <form id="form">
    <label for="input">Message</label>
    <input id="input" type="text" maxlength="1000" autocomplete="off" placeholder="Type your message...">
    <button type="submit">Send</button>
  </form>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const MAX_DISPLAYED_MESSAGES = 500;
    const socket = io();
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const messages = document.getElementById('messages');
    const usernameInput = document.getElementById('username-input');
    const setUsernameButton = document.getElementById('set-username');

    function appendMessage(item) {
      messages.append(item);
      while (messages.childElementCount > MAX_DISPLAYED_MESSAGES) {
        messages.firstElementChild.remove();
      }
      messages.scrollTop = messages.scrollHeight;
    }

    function appendSystemMessage(text) {
      const item = document.createElement('li');
      item.className = 'system-message';
      item.textContent = text;
      appendMessage(item);
    }

    setUsernameButton.addEventListener('click', () => {
      const username = usernameInput.value.trim();
      if (username) {
        socket.emit('set username', username);
        usernameInput.value = '';
      }
    });

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (message) {
        socket.emit('chat message', message);
        input.value = '';
      }
    });

    socket.on('chat message', (data) => {
      const item = document.createElement('li');
      const username = document.createElement('strong');
      username.textContent = `${data.username}:`;
      item.append(username, document.createTextNode(` ${data.message}`));
      appendMessage(item);
    });

    socket.on('user joined', (data) => {
      if (data.oldUsername === 'Anonymous') {
        appendSystemMessage(`${data.newUsername} has joined the chat`);
      } else {
        appendSystemMessage(`${data.oldUsername} is now known as ${data.newUsername}`);
      }
    });

    socket.on('user left', (data) => {
      appendSystemMessage(`${data.username} has left the chat`);
    });

    socket.on('chat error', (data) => {
      appendSystemMessage(data.message);
    });
  </script>
</body>
</html>
